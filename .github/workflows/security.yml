on:
  pull_request:
    types: [opened]
  push:

name: Security
jobs:
  gosec:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      with:
        show-progress: false
    - name: Run Gosec Security Scanner
      uses: securego/gosec@master
      with:
        args: ./...
